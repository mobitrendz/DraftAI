services:
  prestart:
    build:
      context: .
      args:
        UV_SYNC_ARGS: "--no-dev --group test"

  backend:
    build:
      context: .
      args:
        UV_SYNC_ARGS: "--no-dev --group test"
    command: ["pytest"]
    environment:
      - POSTGRES_SERVER=db
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
