name: Test Coverage

on:
  push:
    branches:
      - master
      - stage
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FRONTEND_HOST: http://localhost:5173
      ENVIRONMENT: ci
      PROJECT_NAME: FastAPI Backend Template
      STACK_NAME: fastapi-backend-template-ci
      API_V1_STR: /api/v1
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      EMAIL_RESET_TOKEN_EXPIRE_HOURS: 48
      SUPER_USER_NAME: CI Admin
      SUPER_USER_EMAIL: admin@example.com
      SUPER_USER_PASSWORD: admin123
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fastapi_template_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: prefer
      PGADMIN_EMAIL: admin@example.com
      PGADMIN_PASSWORD: admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Generate coverage badge
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          coverage = ElementTree.parse("coverage.xml").getroot()
          percentage = round(float(coverage.attrib["line-rate"]) * 100, 1)
          message = f"{percentage:g}%"

          if percentage >= 90:
              color = "#4c1"
          elif percentage >= 80:
              color = "#97ca00"
          elif percentage >= 70:
              color = "#dfb317"
          elif percentage >= 60:
              color = "#fe7d37"
          else:
              color = "#e05d44"

          label = "coverage"
          label_width = 68
          message_width = max(42, 11 * len(message))
          total_width = label_width + message_width
          message_center = label_width + message_width / 2

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img" aria-label="{label}: {message}">
            <title>{label}: {message}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="{label_width}" height="20" fill="#555"/>
              <rect x="{label_width}" width="{message_width}" height="20" fill="{color}"/>
              <rect width="{total_width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="34" y="15" fill="#010101" fill-opacity=".3">{label}</text>
              <text x="34" y="14">{label}</text>
              <text x="{message_center}" y="15" fill="#010101" fill-opacity=".3">{message}</text>
              <text x="{message_center}" y="14">{message}</text>
            </g>
          </svg>
          '''

          Path("coverage.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "Update coverage badge [skip ci]"
          git push
