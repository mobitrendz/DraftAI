name: Backend Code Quality

on:
  push:
    branches:
      - master
      - stage
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest

    env:
      FRONTEND_HOST: http://localhost:5173
      ENVIRONMENT: ci
      PROJECT_NAME: FastAPI Backend Template
      STACK_NAME: fastapi-backend-template-ci
      API_V1_STR: /api/v1
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      EMAIL_RESET_TOKEN_EXPIRE_HOURS: 48
      SUPER_USER_NAME: CI Admin
      SUPER_USER_EMAIL: admin@example.com
      SUPER_USER_PASSWORD: admin123
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fastapi_template_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: prefer
      PGADMIN_EMAIL: admin@example.com
      PGADMIN_PASSWORD: admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint --group test

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Run tests
        run: uv run pytest
