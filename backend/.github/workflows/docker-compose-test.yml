name: Docker Validation

on:
  push:
    branches:
      - master
      - stage
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Docker Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          FRONTEND_HOST=http://localhost:5173
          ENVIRONMENT=ci
          PROJECT_NAME=FastAPI Backend Template
          STACK_NAME=fastapi-backend-template-ci
          API_V1_STR=/api/v1
          SECRET_KEY=ci-test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EMAIL_RESET_TOKEN_EXPIRE_HOURS=48
          SUPER_USER_NAME=CI Admin
          SUPER_USER_EMAIL=admin@example.com
          SUPER_USER_PASSWORD=admin123
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=fastapi_template_test
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_SSLMODE=prefer
          PGADMIN_EMAIL=admin@example.com
          PGADMIN_PASSWORD=admin
          EOF

      - name: Build services
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml build

      - name: Run tests
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml run --rm backend

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v --remove-orphans
