[project]
name = "draftai-backend"
version = "0.1.0"
description = "DraftAI backend — smart content assistant API built with FastAPI, SQLModel, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4", # For database migrations, allowing for version control of the database schema and easy application of changes across different environments.
    "fastapi[standard]>=0.135.2", # For building the API with FastAPI
    "psycopg[binary]>=3.3.3", # For PostgreSQL database connectivity
    "pwdlib[argon2]>=0.3.0", # For password hashing
    "pydantic-settings>=2.13.1", # For managing application settings with validation
    "pydantic[email]>=2.12.5", # For email validation in user models
    "pyjwt>=2.12.1", # For JSON Web Token (JWT) handling, used for authentication and authorization in the application
    "sqlmodel>=0.0.37", # For SQLAlchemy-based ORM with Pydantic models, providing an easy way to define database models and perform CRUD operations
    "tenacity>=9.1.4", # For retrying operations with exponential backoff, useful for handling transient errors in database connections or external API calls
    "structlog>=25.1.0", # For structured logging, allowing for better log management and analysis
    "prometheus-fastapi-instrumentator>=7.0.2", # For Prometheus metrics instrumentation, enabling monitoring of the application's performance and behavior
    "slowapi>=0.1.9", # For rate limiting, helping to protect the application from abuse and ensure fair usage
    "fastapi-pagination>=0.12.34", # For pagination support in API endpoints, making it easier to handle large datasets and improve performance
    "python-multipart>=0.0.22", # For handling multipart form data, useful for file uploads and form submissions in the API
    "pydantic-extra-types>=2.11.1", # For additional Pydantic types, providing more options for data validation and serialization in the application
    "sentry-sdk[fastapi]>=2.56.0", # For error tracking and monitoring in the application
    "jinja2>=3.1.6",
    "emails>=1.1.1",
    "email-validator>=2.3.0",
    "rich>=14.3.3",
    "psutil>=7.2.2",
    "arq>=0.26.3",
    "redis>=5.2.1",
    "cryptography>=44.0.0",
    "httpx>=0.27.0",
    "boto3>=1.37.0",
    "pillow>=12.2.0",
]

[dependency-groups]
lint = [
    "ruff>=0.15.5",   # Fast, all-in-one linter and formatter
    "mypy>=1.10.0",   # Static type checking
    "bandit>=1.8.3",   # Security-focused linting
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",   # Required for testing FastAPI endpoints
    "pytest-mock>=3.15.1",
    "testcontainers>=4.14.2",
    "hypothesis>=6.152.4",
]

dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "debugpy>=1.8.20",
    "prek",
    "py-spy>=0.4.2",
    "scalene>=2.2.1",
    "types-passlib>=1.7.7.20260211",     # Type stubs for password hashing (helps Mypy)
    "types-psutil>=7.2.2.20260508",
    "zensical>=0.0.34", # High-performance documentation generator (Rust-powered)
]

[tool.ruff]

line-length = 88
target-version = "py312"
lint.select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG001", # unused arguments
    "S",    # bandit security
]
lint.ignore = ["E501"] # Line too long (handled by formatter)

[tool.mypy]
# Global strict-like settings but allow overrides
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
disable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.pytest]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ty.environment]
python = ".venv/bin/python"
python-version = "3.12"
# Add this to ensure ty looks in the site-packages where the stubs live
extra-paths = [".venv/lib/python3.12/site-packages"]

[tool.ty.analysis]
# PRO TIP: For FastAPI and PyJWT, "replace-imports-with-any" is often better.
# It ensures that 'ty' doesn't cause cascading errors in your auth/route logic.
replace-imports-with-any = ["jwt.**", "fastapi.**"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]  # Ignore hardcoded password checks in the tests directory

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
