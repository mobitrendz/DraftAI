networks:
  proxy:
    driver: bridge

services:
  traefik:
    image: traefik:v3.3
    command:
      - "--api.dashboard=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy

  db:
    image: postgres:18
    container_name: draftai_postgres
    restart: always
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-draftai_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: draftai_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  prestart:
    build: .
    container_name: draftai_prestart
    entrypoint: ["/app/scripts/prestart.sh"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
        restart: true

  backend:
    build: .
    container_name: draftai_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: draftai_worker
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
