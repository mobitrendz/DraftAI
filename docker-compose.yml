# DraftAI local development stack
# Start frontend separately: cd frontend && npm run dev

services:
  db:
    image: postgres:18
    container_name: draftai_postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-draftai_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: draftai_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: draftai_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: draftai_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/draftai-covers --ignore-existing
      "
    restart: "no"

  prestart:
    build:
      context: ./backend
    container_name: draftai_prestart
    entrypoint: ["/app/scripts/prestart.sh"]
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    container_name: draftai_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: draftai_worker
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
