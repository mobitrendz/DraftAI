# Pre-commit configuration for React/TypeScript Frontend
# Mirroring backend philosophy for cross-stack consistency

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, html, json, markdown]
        additional_dependencies:
          - prettier@3.8.3

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: type-check
        name: type-check
        entry: npm run type-check
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: test
        name: test
        entry: npm run test:run
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
